version: '3.8'

services:
  # PostgreSQL Database Service
  db:
    image: postgres:17-alpine
    container_name: vayam_music_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: music_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-qwerty0816}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d music_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vayam_music_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/music_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-qwerty0816}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      JWT_SECRET: ${JWT_SECRET:-9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f1234}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

volumes:
  postgres_data:
