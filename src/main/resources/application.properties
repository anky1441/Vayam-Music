spring.application.name=music
server.port=${PORT:${SERVER_PORT:8080}}

# Database Configuration (supports Render, Neon, Supabase, and local setups)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/music_db}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${DATABASE_USERNAME:postgres}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${DATABASE_PASSWORD:qwerty0816}}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration (>= 256 bits secret)
jwt.secret=${JWT_SECRET:9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f1234}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Google OAuth 2.0 Configuration
google.client-id=${GOOGLE_CLIENT_ID:}
